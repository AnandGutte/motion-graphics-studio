version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      remotion:
        applies-to: version-updates
        patterns:
          - "remotion"
          - "@remotion/*"
        update-types:
          - minor
          - patch
      other-npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
